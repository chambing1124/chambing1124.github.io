    .clouds{animation:cloud-drift 65s linear infinite}.far-hills{animation:land-drift 34s linear infinite}.near-hills{animation:land-drift 17s linear infinite}.road-marks{animation:land-drift 3.6s linear infinite}.flowers{animation:land-drift 7s linear infinite}.bike-bob{animation:bob 1.1s ease-in-out infinite}.scarf{transform-origin:578px 227px;animation:scarf-wave 1.3s ease-in-out infinite}.tail{transform-origin:350px 305px;animation:tail-wave 1.8s ease-in-out infinite}.wing{transform-origin:577px 278px;animation:wing-wave 1.1s ease-in-out infinite}.bird{animation:bird-drift 15s linear infinite}.wind{animation:wind-pulse 2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.7s infinite}.blink.croc{animation-delay:1.8s}.petal{transform-box:fill-box;transform-origin:bottom;animation:flower-wave 2s ease-in-out infinite}.paused *{animation-play-state:paused!important}
    @keyframes land-drift{to{transform:translateX(-1100px)}}@keyframes cloud-drift{to{transform:translateX(-1100px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}@keyframes scarf-wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}@keyframes tail-wave{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes wing-wave{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes wind-pulse{0%,100%{opacity:.2}50%{opacity:.7}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes flower-wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}@keyframes bird-drift{0%{transform:translate(140px,5px)}100%{transform:translate(-220px,-18px)}}
    @media(max-width:650px){body{padding:24px 14px}header{margin-bottom:30px}.intro{margin:0 6px 20px}.tag{display:none}h1{letter-spacing:1px}.subtitle{font-size:11px;letter-spacing:1px}.scene{border-radius:15px}.scene svg{width:150%;max-width:none;margin-left:-25%}footer{padding:18px 2px;flex-wrap:wrap}.caption{font-size:10px}.small-note{display:none}.brand{font-size:10px}.issue{font-size:9px}button{padding:9px 13px}}

  <footer><div class="caption"><span class="dot"></span><span>风刚刚好，朋友也在身旁。</span></div><div class="controls"><span class="small-note">享受沿途</span><button id="speed" type="button" aria-label="切换骑行速度">速度 ×1</button><button id="toggle" type="button" aria-label="暂停动画"><span class="play-icon">Ⅱ</span><span id="toggleText">歇一会儿</span></button></div></footer>
</main>
<script>
  (() => {
    'use strict';
    const byId = id => document.getElementById(id);
    const scene = byId('scene');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let paused = reducedMotion, speed = 1, phase = .45, lastTime = null;
    const ids = ['rearWheel','frontWheel','rearCrank','frontCrank','crocFarLeg','pelicanFarLeg','crocLegOutline','crocLeg','pelicanLeg','crocFoot','pelicanFoot','rearPedal','frontPedal'];
    const el = Object.fromEntries(ids.map(id => [id, byId(id)]));
    // Forward knee bend keeps the riders seated while each foot follows its crank.
    function legPath(hipX, hipY, footX, footY, upper, lower) {
      const dx = footX - hipX, dy = footY - hipY;
      const distance = Math.max(.001, Math.hypot(dx, dy));
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + dx / distance * along + dy / distance * bend;
      const kneeY = hipY + dy / distance * along - dx / distance * bend;
      return `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY}`;
    }
    function rider(angle, cx, hipX, hipY, upper, lower, nearId, farId, footId, pedalId, crankId, outlineId) {
      const dx = Math.cos(angle) * 28, dy = Math.sin(angle) * 28;
      const x = cx + dx, y = 436 + dy;
      const path = legPath(hipX, hipY, x, y - 4, upper, lower);
      el[nearId].setAttribute('d', path);
      if (outlineId) el[outlineId].setAttribute('d', path);
      el[farId].setAttribute('d', legPath(hipX - 5, hipY - 2, cx - dx, 432 - dy, upper, lower));
      el[footId].setAttribute('transform', `translate(${x} ${y - 6})`);
      el[pedalId].setAttribute('d', `M${x-12} ${y+4}h27`);
      el[crankId].setAttribute('d', `M${cx-dx} ${436-dy}L${x} ${y}`);
    }
    function draw() {
      const degrees = phase * 180 / Math.PI;
      el.rearWheel.setAttribute('transform', `rotate(${degrees * 1.45})`);
      el.frontWheel.setAttribute('transform', `rotate(${degrees * 1.45})`);
      rider(phase,417,393,315,76,76,'crocLeg','crocFarLeg','crocFoot','rearPedal','rearCrank','crocLegOutline');
      rider(phase,588,574,321,74,74,'pelicanLeg','pelicanFarLeg','pelicanFoot','frontPedal','frontCrank');
    }
    function setPaused(value) {
      paused = value;
      scene.classList.toggle('paused', paused);
      scene.getAnimations({subtree:true}).forEach(animation => paused ? animation.pause() : animation.play());
      byId('toggleText').textContent = paused ? '继续出发' : '歇一会儿';
      byId('toggle').querySelector('.play-icon').textContent = paused ? '▶' : 'Ⅱ';
      byId('toggle').setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    }
    byId('toggle').addEventListener('click', () => setPaused(!paused));
    byId('speed').addEventListener('click', () => {
      speed = speed === 1 ? 1.5 : speed === 1.5 ? .65 : 1;
      byId('speed').textContent = `速度 ×${speed}`;
      scene.getAnimations({subtree:true}).forEach(animation => animation.updatePlaybackRate(speed));
    });
    function tick(time) {
      if (lastTime !== null && !paused) phase = (phase + Math.min((time - lastTime) / 1000, .05) * 3.2 * speed) % (Math.PI * 400);
      lastTime = time;
      if (!paused) draw();
      requestAnimationFrame(tick);
    }
    draw();
    setPaused(paused);
    document.addEventListener('visibilitychange', () => { lastTime = null; });
    requestAnimationFrame(tick);
  })();
</script>
